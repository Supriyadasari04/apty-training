<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Basic Webpage for CSS Fundamentals Assignment" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Fundamentals: Text, List, and Image Styling</title>

  <!-- Internal CSS -->
  <style>
    /* Universal selector to remove default margin and padding */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Element selector */
    p {
      font-size: 18px;
      line-height: 1.6;
    }

    /* Class selector */
    .container {
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background-color: #f2f2f2;
    }

    /* ID selector */
    #main-heading {
      font-family: Arial, sans-serif;
    }

    /* Image styling using element selector */
    img {
      max-width: 50%;
      height: auto;
      display: block;
      margin-top: 20px;
    }
  </style>

  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <h1 id="main-heading">Welcome to My Styled Page</h1>

    <p>This page demonstrates how to apply CSS using different methods and selectors.</p>

    <ul>
      <li style="color: blue;">This item is styled with inline CSS (blue color).</li>
      <li>Second list item</li>
      <li>Third list item</li>
    </ul>

    <img src="./supriya.png" alt="Sample image for CSS demonstration" />
  </div>

</body>
</html>
