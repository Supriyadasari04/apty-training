<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iFrame Content</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h2>iFrame Content</h2>
  <div id="iframe-receive"></div>
  <script>
    window.addEventListener("message", (e) => {
      document.getElementById("iframe-receive").textContent = "Received: " + e.data;
      e.source.postMessage("Message received: " + e.data, "*");
    });
  </script>
</body>
</html>
