<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrolling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      height: 2000px;
      width: 2000px;
    }
  </style>
</head>
<body>
  <h1>Scrolling Demo</h1>

  <label>X: <input type="number" id="x-input"></label>
  <label>Y: <input type="number" id="y-input"></label>
  <button id="scroll-btn">Scroll To</button>
  <button id="up-btn">Scroll Up</button>
  <button id="down-btn">Scroll Down</button>

  <script src="./scripts/scrolling.js" defer></script>
</body>
</html>
