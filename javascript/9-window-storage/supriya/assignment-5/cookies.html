<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cookies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Cookies Demo</h1>

  <label>
    Cookie Name:
    <input type="text" id="cookie-name">
  </label>
  <br><br>
  <label>
    Cookie Value:
    <input type="text" id="cookie-value">
  </label>
  <br><br>
  <button id="set-cookie">Set Cookie</button>
  <button id="read-cookie">Read Cookie</button>
  <button id="delete-cookie">Delete Cookie</button>
  <div id="cookie-output"></div>

  <script src="./scripts/cookies.js" defer></script>
</body>
</html>
