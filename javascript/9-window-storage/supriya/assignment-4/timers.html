<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Timers Demo</h1>

  <section>
    <h2>Countdown Timer</h2>
    <input type="number" id="countdown-input" placeholder="Seconds">
    <button id="start-countdown">Start Countdown</button>
    <div id="countdown-display"></div>
  </section>

  <section>
    <h2>Stopwatch</h2>
    <button id="start-stopwatch">Start Stopwatch</button>
    <button id="stop-stopwatch">Stop Stopwatch</button>
    <button id="reset-stopwatch">Reset Stopwatch</button>
    <div id="stopwatch-display">0:00</div>
  </section>

  <script src="./script/timers.js" defer></script>
</body>
</html>
