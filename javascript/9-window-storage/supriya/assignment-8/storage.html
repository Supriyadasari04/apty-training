<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Storage Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Storage Demo</h1>

  <label>
    Key:
    <input type="text" id="key-input">
  </label>
  <br><br>
  <label>
    Value:
    <input type="text" id="value-input">
  </label>
  <br><br>
  <button id="save-local">Save to LocalStorage</button>
  <button id="save-session">Save to SessionStorage</button>

  <h2>LocalStorage Data</h2>
  <div id="local-output"></div>

  <h2>SessionStorage Data</h2>
  <div id="session-output"></div>

  <script src="./scripts/storage.js" defer></script>
</body>
</html>
