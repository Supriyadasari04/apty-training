<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arithmetic Operators Calculator</title>
</head>
<body>
  <h2>Arithmetic Operators Calculator</h2>

  <label for="val1">Value 1:</label>
  <input type="number" id="val1">
  <br><br>

  <label for="val2">Value 2:</label>
  <input type="number" id="val2">
  <br><br>

<button id="addBtn">+</button>
<button id="subBtn">-</button>
<button id="mulBtn">*</button>
<button id="divBtn">/</button>
<button id="modBtn">%</button>
<button id="incBtn">++ (val1)</button>
<button id="decBtn">-- (val1)</button>


  <h3>Result:</h3>
  <div id="result"></div>

  <script src="scripts/arithmetic-op.js"></script>
</body>
</html>
