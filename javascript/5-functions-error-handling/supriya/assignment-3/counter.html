<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrow Function Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      background-color: #007bff;
      color: white;
    }
    button:hover {
      background-color: #0056b3;
    }
    #count {
      font-size: 20px;
      margin-top: 15px;
      display: block;
    }
  </style>
</head>
<body>
  <h2>Counter using Arrow Function</h2>
  <button id="incrementBtn">Click Me</button>
  <span id="count">0</span>

  <script src="./scripts/counter.js"></script>
</body>
</html>
