<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array Sorting using Function Expression</title>
  <style>
    table {
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #444;
      padding: 6px 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Sort Numbers using Function Expression</h2>
  <form onsubmit="event.preventDefault(); sortNumbers();">
    <label for="numbers">Enter numbers (comma-separated):</label>
    <input type="text" id="numbers" required>
    <button type="submit">Sort</button>
  </form>

  <div id="result"></div>

  <script src="./scripts/sort.js"></script>
</body>
</html>
