<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Higher-Order Function with Arrow Function</title>
</head>
<body>
    <h1>Filter Numbers Using Higher-Order Function</h1>

    <form id="filterForm">
        <label for="limit">Enter limit (remove numbers greater than this): </label>
        <input type="number" id="limit" required />
        <button type="submit">Filter</button>
    </form>

    <h2>Original Array:</h2>
    <p id="originalArray"></p>

    <h2>Filtered Array:</h2>
    <p id="filteredArray"></p>

    <script src="./scripts/filter-numbers.js"></script>
</body>
</html>
