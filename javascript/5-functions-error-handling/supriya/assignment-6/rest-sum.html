<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sum Using Rest Parameters</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    input {
      padding: 8px;
      margin: 5px;
      font-size: 16px;
      width: 250px;
    }
    button {
      padding: 8px 15px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #2196F3;
      color: white;
      border-radius: 5px;
    }
    p {
      font-size: 18px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Sum of Numbers (Rest Parameters)</h2>
  <form onsubmit="calculateSum(); return false;">
    <label for="numbers">Enter numbers (comma-separated):</label><br>
    <input type="text" id="numbers" placeholder="e.g. 10,20,30,40"><br>
    <button type="submit">Calculate Sum</button>
  </form>

  <p id="result"></p>

  <script src="./scripts/rest-sum.js"></script>
</body>
</html>
