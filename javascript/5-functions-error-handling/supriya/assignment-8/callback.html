<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callback with Default Parameters</title>
</head>
<body>
  <h2>Callback Function with Default Parameters</h2>

  <form onsubmit="processInput(); return false;">
    <label for="userInput">Enter a string:</label><br>
    <input type="text" id="userInput" placeholder="Type something..."><br>
    <button type="submit">Process</button>
  </form>

  <p id="result"></p>

  <script src="./scripts/callback.js"></script>
</body>
</html>
