<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Delegation and Bubbling - Table Highlight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Event Delegation: Highlight Row and Column</h1>

  <table id="myTable" border="1">
    <tbody>
      <!-- Generate 10 rows × 10 columns -->
      <!-- Each cell marked with data attributes for row and column -->
      <!-- For simplicity we write it manually, but could also be generated by JS -->
      <!-- Row 0 -->
      <tr>
        <td data-row="0" data-col="0">1</td>
        <td data-row="0" data-col="1">2</td>
        <td data-row="0" data-col="2">3</td>
        <td data-row="0" data-col="3">4</td>
        <td data-row="0" data-col="4">5</td>
        <td data-row="0" data-col="5">6</td>
        <td data-row="0" data-col="6">7</td>
        <td data-row="0" data-col="7">8</td>
        <td data-row="0" data-col="8">9</td>
        <td data-row="0" data-col="9">10</td>
      </tr>
      <!-- Rows 1–9 could be generated dynamically by JS instead of copy-pasting -->
    </tbody>
  </table>

  <script src="./scripts/event-delegation-bubbling.js" defer></script>
</body>
</html>
