<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keyboard Events: Keydown and Keyup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Keyboard Events Demo</h1>

  <section>
    <h2>Keydown Events</h2>
    <div id="keydown-output" style="border:1px solid black; padding:10px; min-height:100px;">
      <!-- keydown events will appear here -->
    </div>
  </section>

  <section>
    <h2>Keyup Events</h2>
    <div id="keyup-output" style="border:1px solid black; padding:10px; min-height:100px;">
      <!-- keyup events will appear here -->
    </div>
  </section>

  <script src="./scripts/keyboard-events.js" defer></script>
</body>
</html>
