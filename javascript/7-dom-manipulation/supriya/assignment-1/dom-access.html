<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Access & Manipulation</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 10px;
      text-align: center;
    }
    .highlight {
      background-color: yellow;
    }
  </style>
</head>
<body>
  <h2>DOM Access & Manipulation Examples</h2>
  <table>
    <tr>
      <th>id</th>
      <th>className</th>
      <th>tag</th>
      <th>name</th>
      <th>attribute</th>
    </tr>
    <tr>
      <td>
        <p id="para1">Paragraph with id=para1</p>
        <p id="para2">Paragraph with id=para2</p>
        <button onclick="changeColorById()">Change Color by ID</button>
      </td>

      <td>
        <p class="sameClass">Paragraph 1 with class</p>
        <p class="sameClass">Paragraph 2 with class</p>
        <button onclick="toggleClassBackground()">Toggle Background by Class</button>
      </td>

      <td>
        <span>Span 1 text</span><br>
        <span>Span 2 text</span><br>
        <button onclick="changeSpans()">Change Span Text</button>
      </td>

      <td>
        <input type="text" name="user1" value="User One"><br>
        <input type="text" name="user2" value="User Two"><br>
        <button onclick="toggleDisableInputs()">Toggle Disable by Name</button>
      </td>

      <td>
        <p custom-attr="first">Custom attribute element 1</p>
        <p custom-attr="second">Custom attribute element 2</p>
        <button onclick="addNewAttribute()">Add New Attribute</button>
      </td>
    </tr>
  </table>

  <script src="./scripts/dom-access.js"></script>
</body>
</html>
