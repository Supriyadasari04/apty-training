<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested Element Count</title>
</head>
<body>
  <h2>Assignment 5: Display Nested Element Count</h2>

  <div id="parent1">
    <p>Paragraph 1</p>
    <span>Span 1</span>
    <div>
      <p>Nested Paragraph</p>
    </div>
  </div>

  <div id="parent2">
    <p>Paragraph 2</p>
    <span>Span 2</span>
    <span>Span 3</span>
  </div>

  <section id="parent3">
    <div>
      <p>Paragraph 3</p>
      <span>Span 4</span>
    </div>
  </section>

  <button id="countBtn">Count Elements</button>
  <ul id="output"></ul>

  <script src="./scripts/nested-element-count.js"></script>
</body>
</html>
