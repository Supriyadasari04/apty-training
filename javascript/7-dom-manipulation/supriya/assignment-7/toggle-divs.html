<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle Divs</title>
  <style>
    .hidden {
      display: none;
    }
    .box {
      width: 150px;
      height: 100px;
      margin: 10px;
      background-color: lightblue;
      text-align: center;
      line-height: 100px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Assignment 7: Toggle Visibility of Divs</h2>

  <div id="div1" class="box">Div 1</div>
  <div id="div2" class="box hidden">Div 2</div>
  <div id="div3" class="box hidden">Div 3</div>

  <button id="toggleBtn">Toggle Divs</button>

  <script src="./scripts/toggle-divs.js"></script>
</body>
</html>
