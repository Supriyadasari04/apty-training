<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Interest Calculator</title>
</head>
<body>
  <h2>Simple Interest Calculator</h2>
  <label for="principal">Principal Amount (₹):</label>
  <input type="number" id="principal" placeholder="Enter amount">
  <label for="rate">Rate of Interest (% per year):</label>
  <input type="number" id="rate" placeholder="Enter rate">
  <label for="time">Time (in years):</label>
  <input type="number" id="time" placeholder="Enter time">
  <button type="button" onclick="calculateInterest()">Calculate Interest</button>
  <p id="result"></p>
  <script src="./scripts/simpleInteret.js"></script>
</body>
</html>
