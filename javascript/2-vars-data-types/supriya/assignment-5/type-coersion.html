<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Type Coercion with +</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Type Coercion: Addition with +</h2>

  <button onclick="coerceString()">String + others</button>
  <button onclick="coerceNumber()">Number + others</button>
  <button onclick="coerceBoolean()">Boolean + others</button>
  <button onclick="coerceUndefined()">Undefined + others</button>
  <button onclick="coerceNull()">Null + others</button>
  <button onclick="coerceSymbol()">Symbol + others</button>
  <button onclick="coerceObject()">Object + others</button>

  <div id="output"></div>

  <script src="scripts/type-coersion.js"></script>
</body>
</html>
