<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form Demo</title>
  <style>
    h2{
        text-align: center;
        color: #4CAF50;
    }
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    form {
      max-width: 400px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      margin-right: 10px;
      padding: 8px 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>Contact Us</h2>

  <form action="/submit" method="post">
    <!-- Name -->
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>

    <!-- Email -->
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="example@domain.com" required>

    <!-- Message -->
    <label for="message">Your Message:</label>
    <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

    <!-- Buttons -->
    <div class="buttons">
      <button type="submit" onclick="alert('Your form is submitted.')">Submit</button>
      <button type="reset" onclick="alert('Form is resetted, enter your information again!')">Reset</button>
      <button type="button" onclick="alert('This is a custom action!')">Click Me</button>
    </div>
  </form>

</body>
</html>
