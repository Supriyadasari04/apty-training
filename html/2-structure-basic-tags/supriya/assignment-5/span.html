<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlight words using span tag</title>
    <style>
        .bio{
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }
         .highlight {
      color: #fff;
      background-color: #007bff;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .skill {
      color: #e91e63;
      font-weight: bold;
    }
    </style>
</head>
<body>
    <div class="bio">
        I'm <span class="highlight">Supriya Dasari</span>, a passionate learner in 
        <span class="skill">Web Development</span> and <span class="skill">Artificial Intelligence</span>.
        I enjoy building <span class="highlight">user-friendly</span> and <span class="highlight">accessible</span> websites.
      </div>
</body>
</html>
